name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test with coverage
        run: swift test --enable-code-coverage --parallel

      - name: Coverage report
        run: bash scripts/coverage.sh

      - name: 200-LOC lint
        run: bash scripts/check-loc.sh

      - name: DMG packaging smoke test
        run: bash scripts/tests/create-dmg-smoke.sh

      - name: Linux package scripts smoke test
        run: bash scripts/tests/package-linux-smoke.sh

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency scan (audit Package.resolved)
        run: |
          if [ -f Package.resolved ]; then
            cat Package.resolved
          fi
          # Placeholder: integrate `swift-deps-audit` or equivalent when available.
          echo "dep audit placeholder OK"

  linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build Linux CLI + MCP
        run: |
          git config --global --add safe.directory '*'
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libsqlite3-dev
          swift build -c release --product vibevault --product vibevault-mcp

      - name: Smoke CLI help
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          test -x "$BIN/vibevault"
          "$BIN/vibevault" --help
          "$BIN/vibevault-mcp" --help || true
          echo "CLI_BIN=$BIN/vibevault" >> "$GITHUB_ENV"
          echo "MCP_BIN=$BIN/vibevault-mcp" >> "$GITHUB_ENV"

      - name: Package Linux CLI tarball
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tar gzip
          bash scripts/package-linux-cli.sh
          KIND=cli bash scripts/package-linux-deb.sh

      - name: Upload Linux CLI package
        uses: actions/upload-artifact@v4
        with:
          name: vibevault-linux-cli
          path: |
            build/vibevault-linux-*.tar.gz
            build/vibevault_*.deb
          if-no-files-found: error

  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      # SwiftCrossUI 0.9 needs Swift 6 (body macros / BitwiseCopyable).
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install Gtk 4
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-4-dev libglib2.0-dev libsqlite3-dev pkg-config clang

      - name: Build VibeVaultDesktop
        working-directory: apps/VibeVaultDesktop
        run: |
          git config --global --add safe.directory '*'
          rm -f Package.resolved
          swift build -c release --product VibeVaultDesktop

      - name: Smoke binary exists
        run: test -x apps/VibeVaultDesktop/.build/release/VibeVaultDesktop

      - name: Package Linux desktop tarball
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tar gzip curl python3
          bash scripts/package-linux-desktop.sh
          KIND=desktop bash scripts/package-linux-deb.sh
          DOWNLOAD_APPIMAGETOOL=1 bash scripts/package-linux-appimage.sh

      - name: Upload Linux desktop package
        uses: actions/upload-artifact@v4
        with:
          name: vibevault-linux-desktop
          path: |
            build/VibeVaultDesktop-linux-*.tar.gz
            build/VibeVaultDesktop-*.AppDir.tar.gz
            build/VibeVaultDesktop-*.AppImage
            build/vibevault-desktop_*.deb
          if-no-files-found: error

  windows-cli:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        with:
          winsdk: "10.0.22621.0"

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1.13.0
        with:
          swift-version: "6.2"
          update-sdk-modules: true

      - name: Swift version
        run: swift --version

      - name: Fetch SQLite amalgamation
        run: powershell -File scripts/ensure-sqlite-windows.ps1

      - name: Build Windows CLI + MCP
        run: swift build -c release --product vibevault --product vibevault-mcp

      - name: Smoke CLI help
        run: |
          .build\release\vibevault.exe --help
          .build\release\vibevault-mcp.exe --help

      - name: Test VaultCore
        run: swift test --filter VaultCoreTests

      - name: Package Windows CLI zip
        run: powershell -File scripts/package-windows-cli.ps1

      - name: Package Windows CLI MSI
        run: powershell -File scripts/package-windows-msi.ps1

      - name: Upload Windows CLI package
        uses: actions/upload-artifact@v4
        with:
          name: vibevault-windows-cli
          path: |
            build/vibevault-windows-*.zip
            build/vibevault-windows-*.msi
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        with:
          winsdk: "10.0.22621.0"

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1.13.0
        with:
          swift-version: "6.2"
          update-sdk-modules: true

      - name: Swift version
        run: swift --version

      - name: Fetch SQLite amalgamation
        run: powershell -File scripts/ensure-sqlite-windows.ps1

      - name: Build VibeVaultDesktop
        working-directory: apps/VibeVaultDesktop
        run: |
          if (Test-Path Package.resolved) { Remove-Item Package.resolved }
          swift build -c release --product VibeVaultDesktop

      - name: Package Windows desktop zip
        run: powershell -File scripts/package-windows-desktop.ps1

      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v4
        with:
          name: vibevault-windows-desktop
          path: build/VibeVaultDesktop-windows-*.zip
          if-no-files-found: error
